<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘰嘰喳喳大作戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bird-card:hover { transform: translateY(-5px); transition: 0.3s; }
        .correct { background-color: #10B981 !important; color: white !important; border-color: transparent !important; }
        .wrong { background-color: #EF4444 !important; color: white !important; border-color: transparent !important; }
        .audio-controls { display: flex; gap: 0.5rem; justify-content: center; }
        .control-btn {
            background-color: #10B981;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .control-btn:hover { background-color: #059669; transform: scale(1.05); }
        .control-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col">

    <header id="game-header" class="bg-emerald-600 text-white py-6 text-center shadow-lg hidden relative">
        <button onclick="showScreen('menu-screen')" class="absolute left-4 top-1/2 -translate-y-1/2 bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            返回主選單
        </button>
        <h1 class="text-3xl font-bold tracking-wider">嘰嘰喳喳大作戰</h1>
        <p class="text-sm text-emerald-100 mt-1">都市常見鳥類叫聲學習網</p>
    </header>

    <div id="menu-screen" class="flex-1 flex flex-col items-center justify-center p-6 bg-gradient-to-b from-emerald-50 to-stone-50">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-emerald-100 text-center">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707a1 1 0 011.414 0l4.707 4.707h1.586a1 1 0 011 1v4a1 1 0 01-1 1h-1.586l-4.707 4.707a1 1 0 01-1.414 0L5.586 15z"></path>
                </svg>
            </div>
            
            <h1 class="text-4xl font-black text-emerald-800 mb-2 tracking-wide">嘰嘰喳喳大作戰</h1>
            <p class="text-stone-500 mb-8 font-medium">你能光憑聲音就認出都市裡的鳥鄰居嗎？</p>
            
            <div class="space-y-4">
                <button onclick="showScreen('quiz-screen')" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-lg rounded-2xl shadow-md hover:shadow-lg transform hover:scale-105 transition">
                    🎯 開始遊戲 (聽力大考驗)
                </button>
                <button onclick="showScreen('catalog-screen')" class="w-full py-4 bg-stone-700 hover:bg-stone-800 text-white font-bold text-lg rounded-2xl shadow-md hover:shadow-lg transform hover:scale-105 transition">
                    📖 鳥類圖鑑 (知識與題庫)
                </button>
            </div>
            <p class="text-xs text-stone-400 mt-8">環境教育數位教材 v3.1</p>
        </div>
    </div>

    <main id="catalog-screen" class="max-w-6xl mx-auto p-6 flex-1 hidden w-full">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 border-l-4 border-emerald-500 pl-3 gap-2">
            <div>
                <h2 class="text-2xl font-bold">都市鳥類圖鑑</h2>
                <p class="text-sm text-stone-500 mt-1">共 21 種鳥類 • 點擊卡片可查看詳細說明與冷知識，點擊下方按鈕可聆聽叫聲。</p>
            </div>
        </div>
        <div id="bird-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-12"></div>
    </main>

    <main id="quiz-screen" class="max-w-2xl mx-auto p-6 flex-1 hidden w-full justify-center items-center">
        <section class="bg-white p-8 rounded-2xl shadow-xl w-full border border-stone-100 my-8 relative">
            <div class="absolute top-4 right-6 bg-emerald-50 text-emerald-700 font-bold px-3 py-1 rounded-full text-xs" id="quiz-progress">
                第 1 / 5 題
            </div>

            <h2 class="text-3xl font-bold text-center mb-2 text-stone-800">聽力大考驗</h2>
            <p class="text-center text-sm text-stone-400 mb-8">仔細聆聽鳥叫聲，選出正確的鳥類名稱！</p>
            
            <div class="flex flex-col items-center">
                <button id="play-quiz-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white w-20 h-20 rounded-full flex items-center justify-center shadow-lg transition mb-6 focus:outline-none">
                    <div id="quiz-icon-container"></div>
                </button>
                
                <p id="quiz-status-text" class="text-stone-500 mb-8 italic text-sm">點擊上方按鈕聆聽題目</p>
                <div id="options-container" class="w-full grid grid-cols-1 gap-3"></div>

                <button id="view-detail-btn" class="mt-4 hidden text-emerald-600 hover:text-emerald-700 font-medium text-sm underline transition">
                    💡 查看這隻鳥的詳細資料
                </button>

                <button id="next-btn" class="mt-8 hidden bg-stone-800 text-white px-8 py-3 rounded-full hover:bg-stone-700 font-medium text-sm shadow transition">下一題</button>
            </div>
        </section>
    </main>

    <div id="result-screen" class="max-w-md mx-auto p-6 flex-1 hidden w-full flex-col justify-center items-center">
        <div class="bg-white rounded-3xl shadow-xl p-8 border border-stone-100 text-center w-full my-8">
            <h2 class="text-3xl font-black text-stone-800 mb-6">測試結果分析</h2>
            
            <div class="relative w-40 h-40 mx-auto mb-6 flex items-center justify-center bg-emerald-50 rounded-full border-4 border-emerald-500 shadow-inner">
                <div>
                    <span id="result-score" class="text-5xl font-black text-emerald-600">0</span>
                    <span class="text-stone-400 text-xl font-bold"> / 5 題</span>
                </div>
            </div>

            <p class="text-stone-400 text-xs uppercase tracking-wider mb-1">獲得專屬稱號</p>
            <div id="result-badge" class="inline-block bg-emerald-600 text-white font-black text-xl px-6 py-2.5 rounded-2xl shadow-md mb-4 tracking-wide">
                稱號讀取中
            </div>
            
            <p id="result-desc" class="text-stone-600 text-sm px-4 mb-8 leading-relaxed">評價描述</p>
            
            <div class="space-y-3">
                <button onclick="showScreen('quiz-screen')" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow transition">
                    🔄 再挑戰一次
                </button>
                <button onclick="showScreen('menu-screen')" class="w-full py-3 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-xl transition">
                    🏠 回到主選單
                </button>
            </div>
        </div>
    </div>

    <div id="info-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl transform transition-all flex flex-col">
            <div id="modal-quiz-feedback" class="py-2.5 text-center font-bold text-white hidden"></div>

            <div class="relative h-56 bg-stone-100">
                <img id="modal-img" src="" alt="" class="w-full h-full object-cover">
                <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/50 hover:bg-black/70 text-white w-8 h-8 rounded-full flex items-center justify-center transition">✕</button>
            </div>
            <div class="p-6">
                <h3 id="modal-name" class="text-2xl font-bold text-stone-800 mb-1">鳥類名稱</h3>
                <p id="modal-nickname" class="text-emerald-600 font-medium text-sm mb-4">別名/俗稱</p>
                <hr class="border-stone-100 mb-4">
                <div class="space-y-4 text-stone-600 text-sm leading-relaxed">
                    <div>
                        <span class="font-bold text-stone-800 block mb-0.5">🌟 外觀特徵：</span>
                        <p id="modal-feature"></p>
                    </div>
                    <div>
                        <span class="font-bold text-stone-800 block mb-0.5">🎵 叫聲特點：</span>
                        <p id="modal-audio-desc"></p>
                    </div>
                    <div>
                        <span class="font-bold text-stone-800 block mb-0.5">💡 趣味生態：</span>
                        <p id="modal-funfact" class="bg-emerald-50/50 p-3 rounded-xl border border-emerald-100/50 text-emerald-900"></p>
                    </div>
                </div>
            </div>
            <div class="bg-stone-50 px-6 py-4 flex justify-end">
                <button onclick="closeModal()" class="bg-stone-800 hover:bg-stone-700 text-white px-5 py-2 rounded-xl text-sm font-medium transition">我知道了 / 繼續</button>
            </div>
        </div>
    </div>

    <script>
        const birdData = [
            { id: '1', name: '黑冠麻鷺', nickname: '俗稱：大笨鳥、地雷鳥', feature: '身體呈紅褐色，頭頂有黑色冠羽。在草地上覓食時，遇到人會定格不動，像木樁一樣。', audio: 'https://www.xeno-canto.org/sounds/uploaded/FOEKEWGUIX/XC658186-200715_6634_Nycticorax_caledonicus_caledonicus.mp3', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/Nycticorax_caledonicus_caledonicus.jpg/480px-Nycticorax_caledonicus_caledonicus.jpg', audioDesc: '低沉沙啞的「嗯嗯嗯」聲，夜間最常聽見', funfact: '牠們白天多在地上不動，容易踩到，所以被稱為「地雷鳥」。是台灣最神秘的鳥類之一！' },
            { id: '2', name: '喜鵲', nickname: '俗稱：客鳥、帶來好運的鳥', feature: '體型較大，羽毛主要為黑色與純白色交織，雙翅在陽光下會閃爍著藍綠色光澤。', audio: 'https://www.xeno-canto.org/sounds/uploaded/XONQPAMRVP/XC699596-Recording%202022-4-23%2014-32-14.mp3', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Pica_serica.jpg/480px-Pica_serica.jpg', audioDesc: '刺耳的「喳喳喳」聲，重複而響亮', funfact: '在古代被認為是帶來好消息的「喜訊鳥」，常群聚活動，非常聰明！' },
            { id: '3', name: '五色鳥', nickname: '別名：台灣擬啄木、森林中的花和尚', feature: '全身大部分為鮮豔的翠綠色，頭部則有黃、藍、紅、黑等顏色交雜，像彩虹。', audio: 'https://www.xeno-canto.org/sounds/uploaded/HYSJHMDXIN/XC646905-Megalaima%20nuchalis_9%2027%202021.mp3', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Megalaima_nuchalis.jpg/480px-Megalaima_nuchalis.jpg', audioDesc: '連續重複的「托、托、托」聲，像敲木頭', funfact: '會在樹木上啄洞築巢，叫聲非常規律，早晨最活躍！' },
            { id: '4', name: '白頭翁', nickname: '俗稱：白頭鵯、都市三俠之一', feature: '頭頂後半部有一塊非常明顯的白羽毛，像是長了白頭髮的老爺爺，因此得名。', audio: 'https://www.xeno-canto.org/sounds/uploaded/EWKQYITGFT/XC647963-white-eared%20bulbul.m4a', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Pycnonotus_sinensis_-_20080410.jpg/480px-Pycnonotus_sinensis_-_20080410.jpg', audioDesc: '嘹亮而多變的「ㄨㄟ~ㄨㄟ」聲，帶有上揚的音調', funfact: '非常聰明，會學其他鳥叫，在都市公園最常見，數量很多！' },
            { id: '5', name: '麻雀', nickname: '別名：厝鳥、都市三俠之一', feature: '體型嬌小，身上主要是棕色與黑色的斑駁羽毛，雙頰各有一塊非常明顯的黑斑。', audio: 'https://www.xeno-canto.org/sounds/uploaded/CTEBHZSEZG/XC673638-Tree%20Sparrow%202020-4-25%2012-23-37.mp3', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Passer_montanus_-_Khimachal_1.jpg/480px-Passer_montanus_-_Khimachal_1.jpg', audioDesc: '「啾啾啾」的連續短聲，高音尖銳', funfact: '過去是台灣最常見的鳥，現在數量減少，與人類生活息息相關！' },
            { id: '6', name: '珠頸斑鳩', nickname: '俗稱：斑鳩、脖子戴珍珠項鍊的鳥', feature: '身體呈粉褐色，最經典的特徵是脖子後面有一條黑底、佈滿白點的花紋，像珍珠項鍊。', audio: 'https://www.xeno-canto.org/sounds/uploaded/ZZWVYZTFRN/XC633994-Spotted%20Dove%20030421.m4a', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Streptopelia_chinensis_2.jpg/480px-Streptopelia_chinensis_2.jpg', audioDesc: '低沉溫柔的「咕~咕咕、咕~咕咕」聲，像在說「我愛你」', funfact: '叫聲很像唐詩「詩云漁父」的韻味，在都市常群聚活動！' },
            { id: '7', name: '家八哥', nickname: '別名：外來種八哥、黃腳八哥', feature: '全身大致為黑褐色，眼睛周圍、嘴喙以及腳全部都是鮮豔的黃色，翅膀有白色斑塊。', audio: 'https://www.xeno-canto.org/sounds/uploaded/CVKQPMHRRQ/XC639506-Common%20Myna%2C%20Manali_262017.m4a', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Acridotheres_tristis_-_Kolkata_2011-11-27.jpg/480px-Acridotheres_tristis_-_Kolkata_2011-11-27.jpg', audioDesc: '響亮的「唧唧」聲和各種嘰喳聲，常群聚吵雜', funfact: '從印度引進的外來種，適應力強，現在已成為都市常客！' },
            { id: '8', name: '綠繡眼', nickname: '俗稱：白眼圈、綠色小精靈', feature: '身體大部分為翠綠色，最特別的是眼睛周圍有一圈細細的白色眼圈，像戴著眼鏡。', audio: 'https://www.xeno-canto.org/sounds/uploaded/KQNGKWUVMA/XC695270-White-eye%20Zosterops%20japonica%20call%2019-25kHz%202021-11-30%2008-44-48.mp3', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/Zosterops_japonica_-_Osaka_-_Japan_-female_%281%29.jpg/480px-Zosterops_japonica_-_Osaka_-_Japan_-female_%281%29.jpg', audioDesc: '嘰嘰、啾啾的高頻細碎聲，清脆連續，像「tsee-tsee」', funfact: '喜歡群體活動，常在樹上找蟲吃。眼圈是牠最可愛的特徵！' },
            { id: '9', name: '小白鷺', nickname: '俗稱：白鷺鷥、純白小精靈', feature: '全身潔白，頸部修長，嘴巴黑色尖長。飛行姿態優雅，常在淺水處覓食。', audio: 'https://www.xeno-canto.org/sounds/uploaded/YHOPJWKUVM/XC637857-Cattle%20Egret%20-%20singing%20200408.mp3', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Egretta_garzetta_garzetta.JPG/480px-Egretta_garzetta_garzetta.JPG', audioDesc: '沙啞的「嘎－嘎」聲，短促有力，飛起時最常聽見', funfact: '經常跟在農民或牛後面捕食昆蟲，是農地的好幫手！' },
            { id: '10', name: '夜鷺', nickname: '俗稱：暗光鳥、夜間獵手', feature: '頭頂和背部為墨綠色，腹部白色，眼睛紅色，體型較小白鷺壯碩。', audio: 'https://www.xeno-canto.org/sounds/uploaded/SVWJVLOXQQ/XC699318-NC%20BRD%20SOUND%20LIBRARY%20-Nycticorax%20nycticorax%20-Night%20Heron%20-2021.04.25%20-05.18%20hrs%20-192%20kbps%20-96%20kHz%20-Mono-192001.mp3', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Nycticorax_nycticorax_nycticorax.jpg/480px-Nycticorax_nycticorax_nycticorax.jpg', audioDesc: '低沉沙啞的「呱－呱」聲，鳴聲較長，夜間最常聽見', funfact: '是真正的「夜行俠」，白天躲在樹叢裡，晚上才出來獵食！' },
            { id: '11', name: '黃頭鷺', nickname: '俗稱：黃頭白鷺、田間小衛士', feature: '身體潔白，頭部金黃色，嘴巴黑色，腿是黑色的，看起來很搶眼。', audio: 'https://www.xeno-canto.org/sounds/uploaded/YHOPJWKUVM/XC637857-Cattle%20Egret%20-%20singing%20200408.mp3', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Bubulcus_ibis_-_Sylhet%2C_Bangladesh_-_females_and_males_-8.jpg/480px-Bubulcus_ibis_-_Sylhet%2C_Bangladesh_-_females_and_males_-8.jpg', audioDesc: '粗啞的「rrrak」或「kraak」聲，響亮短促', funfact: '很會跟著牲畜吃昆蟲，是農人的好幫手，通常成群活動！' },
            { id: '12', name: '大卷尾', nickname: '俗稱：鳳頭卷尾、都市空中特技王', feature: '全身黑色光亮，頭頂有漂亮的冠羽，尾巴長且呈優雅的卷曲形狀。', audio: 'https://www.xeno-canto.org/sounds/uploaded/YBUYHBXTQT/XC663319-Dicrurus%20macrocercus%20%28Black%20Drongo%29%20%28calls%29.wav', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Dicrurus_macrocercus_-_Kolkata_2011-10-02_-_male.jpg/480px-Dicrurus_macrocercus_-_Kolkata_2011-10-02_-_male.jpg', audioDesc: '多變尖銳的「jee-jee」或「kwee-kwee」聲，有時連續多種聲音', funfact: '非常聰明，會學其他鳥類叫聲，也會模仿人聲，在空中飛行技術超群！' },
            { id: '13', name: '家燕', nickname: '俗稱：燕子、春天的信使', feature: '背部藍黑色，腹部棕白色，額頭和喉部為紅褐色。尾巴成對叉開，飛行優雅。', audio: 'https://www.xeno-canto.org/sounds/uploaded/BBRIHZTAKZ/XC643948-Barn%20Swallow%20singing%202021-05-29.mp3', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Barn_swallow_2_Luc_Sararens.jpg/480px-Barn_swallow_2_Luc_Sararens.jpg', audioDesc: '輕快連續的「chi-chirrup」或「tsee-tsee」聲，帶有啾啾咭咭聲', funfact: '春天來臨時最先出現，被視為春天的信使。會在建築物下築巢！' },
            { id: '14', name: '台灣藍鵲', nickname: '俗稱：藍鵲、台灣特有種飛行員', feature: '頭頂和背部為深藍色，腹部和尾部為亮藍色，嘴巴和眼圈為紅色，非常醒目。', audio: 'https://www.xeno-canto.org/sounds/uploaded/QMXWPZNQSJ/XC582701-Taiwan%20blue%20magpie%2013%20aug%202016.wav', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Urocissa_caerulea_-_20041226.jpg/480px-Urocissa_caerulea_-_20041226.jpg', audioDesc: '響亮連貫的「ga-ga-ga」或「kraa」聲，群體時連續大聲叫', funfact: '是台灣特有種，聰慧且好奇心強，常以小群體活動，喜歡群聚叫聲！' },
            { id: '15', name: '樹鵲', nickname: '俗稱：樹鵲、山林的吵鬼', feature: '背部為藍黑色，腹部為棕褐色，頭部黑色，尾巴長且呈黑藍色。', audio: 'https://www.xeno-canto.org/sounds/uploaded/QMXWPZNQSJ/XC582705-Magpie%20robin%20chack%202.wav', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Dendrocitta_formosae_-_20040307.jpg/480px-Dendrocitta_formosae_-_20040307.jpg', audioDesc: '多變響亮的「chack-chack」或「kraak」系列聲音', funfact: '是台灣常見的叢林鳥類，非常吵鬧，但很聰明，會群聚活動！' },
            { id: '16', name: '紅嘴黑鵯', nickname: '俗稱：黑鵯、紅嘴小天使', feature: '頭部和背部為黑色，腹部為灰白色，最特別的是嘴巴為紅色，看起來很獨特。', audio: 'https://www.xeno-canto.org/sounds/uploaded/GVFNLSOMRU/XC687892-Red-billed%20Black%20Bulbul.wav', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Hypsipetes_leucocephalus_nigerrimus_20140516.jpg/480px-Hypsipetes_leucocephalus_nigerrimus_20140516.jpg', audioDesc: '嘹亮多變的「pi-pi」或「chee-chu」聲，叫聲悠揚好聽', funfact: '嘴巴紅色很特別，喜歡在樹上覓食果實，聲音優美動聽！' },
            { id: '17', name: '蒼鷺', nickname: '俗稱：大鷺、東亞最大的鷺科鳥', feature: '身體巨大灰藍色，頸部長且有黑色條紋，頭部有黑冠羽，喙長而強壯。', audio: 'https://www.xeno-canto.org/sounds/uploaded/XZLRPKTKZS/XC598449-Grey%20Heron%20%28feeding%20call%29%20%282%29.wav', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d6/Ardea_cinerea_2_%28Marek_Szczepanek%29.jpg/480px-Ardea_cinerea_2_%28Marek_Szczepanek%29.jpg', audioDesc: '低沉沙啞的「呱」聲，有點像青蛙叫，飛行或警戒時發出', funfact: '是台灣最大的鷺科鳥類，在溼地和河邊覓食，非常害羞！' },
            { id: '18', name: '黑領椋鳥', nickname: '俗稱：黑領八哥、愛唱歌的模仿大師', feature: '身體為棕灰色，頭頸部為黑色，額頭有黃色斑塊，嘴巴黃色，非常聰慧。', audio: 'https://www.xeno-canto.org/sounds/uploaded/QCTXQNDNMS/XC644476-Acridotheres%20cristatellus%20%28Crested%20Myna%29%20calls.wav', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Acridotheres_cristatellus_-_Nankow_-_China_-juvenile-8.jpg/480px-Acridotheres_cristatellus_-_Nankow_-_China_-juvenile-8.jpg', audioDesc: '多種模仿聲、清脆或沙啞的「chii-chii」或「chep」聲，群聚吵雜', funfact: '是天才模仿家，會學各種聲音，常群聚活動，非常聰明！' },
            { id: '19', name: '鳳頭蒼鷹', nickname: '俗稱：蒼鷹、猛禽中的獵人', feature: '背部藍灰色，腹部白色帶褐色橫紋，頭頂有兩根長羽毛像「角」，眼睛黃色銳利。', audio: 'https://www.xeno-canto.org/sounds/uploaded/CXTFLZURVS/XC677819-%E9%B3%B3%E9%A0%AD%E8%92%BC%E9%B7%B9%20%28%E5%B0%8F%29%20Accipiter%20trivirgatus%20-2020-03-20.wav', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Accipiter_trivirgatus_-_Kaeng_Krachan_-Thailand_-male-8.jpg/480px-Accipiter_trivirgatus_-_Kaeng_Krachan_-Thailand_-male-8.jpg', audioDesc: '短促重複的「ki-ki-ki」叫聲，繁殖季時較常聽見，警戒感強', funfact: '是身手敏捷的空中獵手，常在樹林間高速飛行捕獵，非常聰明機警！' },
            { id: '20', name: '白尾八哥', nickname: '俗稱：大八哥、嘴巴黃色的歌手', feature: '身體為黑褐色，尾巴黑色帶白色斑塊，嘴巴和眼圈為黃色，看起來很醒目。', audio: 'https://www.xeno-canto.org/sounds/uploaded/CVKQPMHRRQ/XC639506-Common%20Myna%2C%20Manali_262017.m4a', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Acridotheres_grandis.JPG/480px-Acridotheres_grandis.JPG', audioDesc: '多變響亮，發出「kwee」「chee」「chaa」等聲音，也有學舌能力', funfact: '智商超高，會學各種聲音包括人聲，常成群活動，很會唱歌！' },
            { id: '21', name: '紅冠水雞', nickname: '俗稱：紅冠雞、溼地的紅衣小王子', feature: '身體黑色，額頭和冠部為醒目的紅色，嘴巴黃色帶紅色，腿為紅色。', audio: 'https://www.xeno-canto.org/sounds/uploaded/TBLCGGZPDE/XC673851-Common%20Moorhen%20%28Gallinula%20chloropus%29_2021-04-17.mp3', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Gallinula_chloropus_-_Hodbarrow_Reedbed%2C_Millom%2C_Cumbria_-_UK-8.jpg/480px-Gallinula_chloropus_-_Hodbarrow_Reedbed%2C_Millom%2C_Cumbria_-_UK-8.jpg', audioDesc: '銳利短促的「kek」或「krek」聲，緊張時哀鳴音明顯', funfact: '喜歡在有水草的淺水區活動，紅色冠部非常醒目，常在池塘見到！' },
        ];

        const birdGrid = document.getElementById('bird-grid');
        const playQuizBtn = document.getElementById('play-quiz-btn');
        const quizIconContainer = document.getElementById('quiz-icon-container');
        const quizStatusText = document.getElementById('quiz-status-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const viewDetailBtn = document.getElementById('view-detail-btn');

        let currentQuizBird = null;
        let quizAudio = new Audio();
        let birdAudios = {}; 
        let isAudioPlaying = false; 
        let currentCatalogAudio = null; 

        // 遊戲狀態變數
        let quizRound = 0;   // 目前第幾題
        let score = 0;       // 答對題數
        const totalQuestions = 5; // 總題數固定為 5

        const playIconHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
        const pauseIconHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

        // ==========================================
        // 場景切換功能
        // ==========================================
        function showScreen(screenId) {
            quizAudio.pause();
            stopCurrentCatalogAudio();
            updateQuizIcon(false);

            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('catalog-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-header').classList.add('hidden');

            if (screenId === 'menu-screen') {
                document.getElementById('menu-screen').style.display = 'flex';
            } else {
                document.getElementById('game-header').classList.remove('hidden');
                document.getElementById(screenId).classList.remove('hidden');
                if (screenId === 'quiz-screen') {
                    resetGame(); // 初始化一局新遊戲
                }
            }
        }

        // ==========================================
        // 彈出視窗控制 (Modal)
        // ==========================================
        function openModal(bird, isQuizMode = false, isCorrect = false) {
            document.getElementById('modal-img').src = bird.img;
            document.getElementById('modal-img').alt = bird.name;
            document.getElementById('modal-name').innerText = bird.name;
            document.getElementById('modal-nickname').innerText = bird.nickname;
            document.getElementById('modal-feature').innerText = bird.feature;
            document.getElementById('modal-audio-desc').innerText = bird.audioDesc;
            document.getElementById('modal-funfact').innerText = bird.funfact;
            
            const feedbackBar = document.getElementById('modal-quiz-feedback');
            if (isQuizMode) {
                feedbackBar.classList.remove('hidden');
                if (isCorrect) {
                    feedbackBar.className = "py-2.5 text-center font-bold text-white bg-emerald-500 text-sm tracking-wide shadow-inner";
                    feedbackBar.innerText = "🎉 恭喜你！答對了！";
                } else {
                    feedbackBar.className = "py-2.5 text-center font-bold text-white bg-red-500 text-sm tracking-wide shadow-inner";
                    feedbackBar.innerText = `❌ 答錯囉！標準答案是【${bird.name}】`;
                }
            } else {
                feedbackBar.classList.add('hidden');
            }

            document.getElementById('info-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('info-modal').classList.add('hidden');
        }

        // ==========================================
        // 初始化圖鑑渲染
        // ==========================================
        birdData.forEach(bird => {
            const audio = new Audio(bird.audio);
            birdAudios[bird.id] = audio;

            const card = document.createElement('div');
            card.className = 'bird-card bg-white rounded-xl overflow-hidden shadow-md border-2 border-transparent hover:border-emerald-400 flex flex-col justify-between cursor-pointer';
            card.onclick = () => openModal(bird, false);
            
            card.innerHTML = `
                <div>
                    <img src="${bird.img}" alt="${bird.name}" class="w-full h-48 object-cover">
                    <div class="p-4 text-center font-bold text-lg text-stone-800">${bird.name}</div>
                </div>
                <div class="audio-controls pb-4 px-2">
                    <button class="control-btn play-btn" data-bird-id="${bird.id}" title="播放">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>播放
                    </button>
                    <button class="control-btn pause-btn" data-bird-id="${bird.id}" title="暫停">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>暫停
                    </button>
                    <button class="control-btn replay-btn" data-bird-id="${bird.id}" title="重播">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>重播
                    </button>
                </div>
            `;
            birdGrid.appendChild(card);
        });

        function stopCurrentCatalogAudio() {
            if (currentCatalogAudio) currentCatalogAudio.pause();
        }

        // 圖鑑音訊按鈕事件攔截
        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation(); stopCurrentCatalogAudio(); quizAudio.pause(); updateQuizIcon(false);
                currentCatalogAudio = birdAudios[btn.dataset.birdId]; currentCatalogAudio.play();
            });
        });
        document.querySelectorAll('.pause-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); birdAudios[btn.dataset.birdId].pause(); });
        });
        document.querySelectorAll('.replay-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation(); stopCurrentCatalogAudio(); quizAudio.pause(); updateQuizIcon(false);
                currentCatalogAudio = birdAudios[btn.dataset.birdId]; currentCatalogAudio.currentTime = 0; currentCatalogAudio.play();
            });
        });

        // ==========================================
        // 測驗核心與回合邏輯
        // ==========================================
        function resetGame() {
            quizRound = 0;
            score = 0;
            nextAndNextRound();
        }

        function nextAndNextRound() {
            quizRound++;
            if (quizRound > totalQuestions) {
                endGameAndShowResult();
                return;
            }
            
            // 更新畫面上第幾題的文字
            document.getElementById('quiz-progress').innerText = `第 ${quizRound} / ${totalQuestions} 題`;

            quizAudio.pause();
            stopCurrentCatalogAudio();
            isAudioPlaying = false;
            updateQuizIcon(false);

            nextBtn.classList.add('hidden');
            viewDetailBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';
            quizStatusText.innerText = "點擊上方按鈕聆聽題目";
            
            // 隨機選題目
            currentQuizBird = birdData[Math.floor(Math.random() * birdData.length)];
            quizAudio.src = currentQuizBird.audio;

            let options = [currentQuizBird.name];
            let otherBirds = birdData.filter(b => b.name !== currentQuizBird.name);
            otherBirds.sort(() => 0.5 - Math.random());
            options.push(otherBirds[0].name, otherBirds[1].name);
            options.sort(() => 0.5 - Math.random());

            options.forEach(optName => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-3 px-4 text-base font-semibold border-2 border-stone-200 text-stone-700 rounded-xl hover:bg-stone-100 transition duration-200 focus:outline-none';
                btn.innerText = optName;
                btn.onclick = () => checkAnswer(btn, optName);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedBtn, chosenName) {
            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => btn.disabled = true);
            quizAudio.pause();
            updateQuizIcon(false);

            let isCorrect = (chosenName === currentQuizBird.name);

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                quizStatusText.innerText = "太棒了！答對囉！🎉";
                score++;
            } else {
                selectedBtn.classList.add('wrong');
                quizStatusText.innerText = `可惜！這是 【${currentQuizBird.name}】 的叫聲喔！`;
                allButtons.forEach(btn => {
                    if (btn.innerText === currentQuizBird.name) btn.classList.add('correct');
                });
            }

            // 觸發幫忙點：自動跳出該鳥類的學習視窗，並附帶答題回饋
            setTimeout(() => {
                openModal(currentQuizBird, true, isCorrect);
            }, 300);

            // 允許玩家再次手動點開看
            viewDetailBtn.onclick = () => openModal(currentQuizBird, true, isCorrect);
            viewDetailBtn.classList.remove('hidden');

            // 改變按鈕文字，最後一題時按鈕變成「看結果」
            if (quizRound === totalQuestions) {
                nextBtn.innerText = "查看結算結果";
            } else {
                nextBtn.innerText = "下一題";
            }
            nextBtn.classList.remove('hidden');
        }

        // ==========================================
        // 結算與分析圖處理
        // ==========================================
        function endGameAndShowResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            // 填入答對題數
            document.getElementById('result-score').innerText = score;

            // 根據得分給予封號與介紹文字
            const badgeEl = document.getElementById('result-badge');
            const descEl = document.getElementById('result-desc');

            if (score === 5) {
                badgeEl.innerText = "👑 都市鳥類大師";
                badgeEl.className = "inline-block bg-amber-500 text-white font-black text-xl px-6 py-2.5 rounded-2xl shadow-md mb-4 tracking-wide animate-bounce";
                descEl.innerText = "太不可思議了！你竟然達成了完美通關！都市叢林裡的大小鳥鳴完全逃不過你的耳朵，你簡直就是鳥兒在人間的代言人！🌟";
            } else if (score >= 3) {
                badgeEl.innerText = "🦉 賞鳥資深專家";
                badgeEl.className = "inline-block bg-emerald-600 text-white font-black text-xl px-6 py-2.5 rounded-2xl shadow-md mb-4 tracking-wide";
                descEl.innerText = "非常厲害！你已經能精準分辨大部分都會鳥類的聲音。下次在公園散步時，不妨抬頭找找看，你一定能一秒認出牠們！";
            } else if (score >= 1) {
                badgeEl.innerText = "🐣 賞鳥實習生";
                badgeEl.className = "inline-block bg-stone-600 text-white font-black text-xl px-6 py-2.5 rounded-2xl shadow-md mb-4 tracking-wide";
                descEl.innerText = "有進步的空間喔！雖然聽出了一些端倪，但有些鳥類的神秘叫聲還是讓你困惑了。點進圖鑑多聽幾次，你一定能突飛猛進！";
            } else {
                badgeEl.innerText = "🥚 迷路的小鳥";
                badgeEl.className = "inline-block bg-red-400 text-white font-black text-xl px-6 py-2.5 rounded-2xl shadow-md mb-4 tracking-wide";
                descEl.innerText = "哎呀，全部都被鳥兒們忽悠過去了！別灰心，這代表你有無限的成長潛力。先去「鳥類圖鑑」好好的特訓一下，再回來復仇！";
            }
        }

        function updateQuizIcon(playing) {
            isAudioPlaying = playing;
            if (playing) {
                quizIconContainer.innerHTML = pauseIconHTML;
                quizStatusText.innerText = "播放中...";
            } else {
                quizIconContainer.innerHTML = playIconHTML;
                if (!nextBtn.classList.contains('hidden')) return;
                quizStatusText.innerText = "點擊上方按鈕聆聽題目";
            }
        }

        playQuizBtn.onclick = () => {
            stopCurrentCatalogAudio();
            if (isAudioPlaying) {
                quizAudio.pause(); updateQuizIcon(false);
            } else {
                quizAudio.play(); updateQuizIcon(true);
            }
        };

        quizAudio.addEventListener('ended', () => updateQuizIcon(false));
        nextBtn.onclick = nextAndNextRound;

        document.getElementById('info-modal').onclick = function(e) {
            if (e.target === this) closeModal();
        };
    </script>
</body>
</html>
